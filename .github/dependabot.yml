version: 2

# Dependency update PRs. Security *alerts* work off the dependency graph and
# don't need this file — this is only about routine version bumps.
updates:
  # GitHub Actions used by the workflows in .github/workflows/.
  # Worth having: two of them (hacs/action@main, home-assistant/actions/hassfest@master)
  # deliberately track moving branches per their vendors' documented usage, so
  # this at least keeps the pinned ones (actions/checkout, actions/setup-python)
  # current and visible.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Python test dependencies (requirements_test.txt).
  #
  # Most entries here are deliberately unpinned (PHACC and therefore Home
  # Assistant are pinned per-job in test.yml instead), so in practice the only
  # thing Dependabot can bump is the ruff pin.
  #
  # CAUTION: ruff is pinned in TWO places that must agree —
  # requirements_test.txt and the `pip install ruff==...` line in
  # .github/workflows/test.yml. CI installs ruff from the workflow, not from
  # this file, so a Dependabot PR that bumps only requirements_test.txt will
  # pass CI while leaving the two out of sync. Mirror the version into test.yml
  # in the same PR before merging.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      python:
        patterns: ["*"]
