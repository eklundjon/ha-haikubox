version: 2

# Dependency update PRs. Security *alerts* work off the dependency graph and
# don't need this file — this is only about routine version bumps.
updates:
  # GitHub Actions used by the workflows in .github/workflows/.
  # Worth having: two of them (hacs/action@main, home-assistant/actions/hassfest@master)
  # deliberately track moving branches per their vendors' documented usage, so
  # this at least keeps the pinned ones (actions/checkout, actions/setup-python)
  # current and visible.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Python test dependencies (requirements_test.txt).
  #
  # Most entries there are deliberately unpinned (PHACC, and therefore Home
  # Assistant, are pinned per-job in test.yml instead), so in practice the only
  # thing Dependabot bumps here is the ruff pin — which the lint job now reads
  # straight out of requirements_test.txt, so a bump updates CI in the same PR.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      python:
        patterns: ["*"]
    ignore:
      # aiofiles appears in requirements_test.txt only to MIRROR manifest.json's
      # runtime requirement — the manifest is the source of truth, and it keeps a
      # deliberately low floor (>=23.0) for broad compatibility. Letting
      # Dependabot raise it here would mean testing against a floor we don't
      # ship, the same fidelity problem the HA version matrix exists to avoid.
      # Raise it in manifest.json first, deliberately, then mirror it across.
      #
      # The update-types list is deliberate and must NOT be collapsed to a bare
      # `- dependency-name: aiofiles`. An unqualified ignore also suppresses
      # SECURITY update PRs ("Setting this option will also affect pull requests
      # for security updates", per Dependabot's options reference), which would
      # silently opt this dependency out of automated vulnerability fixes.
      # Naming the three version-update types confines the ignore to routine
      # bumps, so a security fix for aiofiles still opens a PR.
      - dependency-name: aiofiles
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
