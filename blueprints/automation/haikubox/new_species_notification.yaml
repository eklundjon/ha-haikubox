blueprint:
  name: Haikubox — New species notification
  description: >
    Send a mobile push notification (with the bird's photo) the first time
    your Haikubox ever hears a given species. Fires off the integration's
    `new_species` device trigger, so it only alerts on genuine lifetime
    firsts — not on a fresh install bootstrapping its history.
  domain: automation
  source_url: https://github.com/eklundjon/ha-haikubox/blob/main/blueprints/automation/haikubox/new_species_notification.yaml
  author: ha-haikubox
  input:
    haikubox_device:
      name: Haikubox
      description: The Haikubox to watch for new species.
      selector:
        device:
          filter:
            integration: haikubox
    notify_device:
      name: Device to notify
      description: >
        Device running the official Home Assistant app. It will receive the
        push notification, including the bird's photo when one is available.
      selector:
        device:
          filter:
            integration: mobile_app
    notification_title:
      name: Notification title
      description: Title of the push notification.
      default: New bird at the Haikubox! 🐦
    notification_message:
      name: Notification message
      description: >
        Body of the push notification. The bird's common name is available as
        {{ species }} and the box name as {{ device_name }}.
      default: "First-ever detection of {{ species }} at {{ device_name }}."

triggers:
  - trigger: device
    domain: haikubox
    device_id: !input haikubox_device
    type: new_species

variables:
  species: "{{ trigger.event.data.species }}"
  scientific_name: "{{ trigger.event.data.scientific_name }}"
  device_name: "{{ trigger.event.data.device_name }}"
  image_url: "{{ trigger.event.data.image_url }}"

actions:
  - alias: Send the new-species notification
    domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: !input notification_title
    message: !input notification_message
    data: >
      {{ {'image': image_url, 'attachment': {'url': image_url}} if image_url else {} }}
