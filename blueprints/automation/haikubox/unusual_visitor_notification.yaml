blueprint:
  name: Haikubox — Unusual visitor notification
  description: >
    Send a mobile push notification (with the bird's photo) when a species
    your Haikubox already knows returns after a long absence. Fires off the
    integration's `unusual_visitor` device trigger; how long a bird must have
    gone unheard to count is set per-Haikubox in the integration's options
    (default 30 days).
  domain: automation
  source_url: https://github.com/eklundjon/ha-haikubox/blob/main/blueprints/automation/haikubox/unusual_visitor_notification.yaml
  author: ha-haikubox
  input:
    haikubox_device:
      name: Haikubox
      description: The Haikubox to watch for returning visitors.
      selector:
        device:
          filter:
            integration: haikubox
    notify_device:
      name: Device to notify
      description: >
        Device running the official Home Assistant app. It will receive the
        push notification, including the bird's photo when one is available.
      selector:
        device:
          filter:
            integration: mobile_app
    notification_title:
      name: Notification title
      description: Title of the push notification.
      default: An unusual visitor returned! 🐦
    notification_message:
      name: Notification message
      description: >
        Body of the push notification. Available: {{ species }} (common name),
        {{ device_name }} (the box), and {{ days_absent }} (days since the
        previous sighting).
      default: "{{ species }} is back at {{ device_name }} after {{ days_absent }} days away."

triggers:
  - trigger: device
    domain: haikubox
    device_id: !input haikubox_device
    type: unusual_visitor

variables:
  species: "{{ trigger.event.data.species }}"
  scientific_name: "{{ trigger.event.data.scientific_name }}"
  device_name: "{{ trigger.event.data.device_name }}"
  image_url: "{{ trigger.event.data.image_url }}"
  days_absent: "{{ trigger.event.data.days_absent }}"

actions:
  - alias: Send the unusual-visitor notification
    domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: !input notification_title
    message: !input notification_message
    data: >
      {{ {'image': image_url, 'attachment': {'url': image_url}} if image_url else {} }}
